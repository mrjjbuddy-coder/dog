<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catch the Tiny Man & Save Your Job Applications!</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        #ui { position: absolute; top: 15px; left: 20px; color: white; font-size: 20px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #instructions { position: absolute; bottom: 15px; width: 100%; text-align: center; color: #ddd; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>

    <div id="ui">
        Applications Recovered: <span id="score">0</span> | 
        <span id="timer">Time Left: 45s</span>
    </div>
    <div id="crosshair"></div>
    <div id="instructions">Use <b>W/A/S/D</b> or Arrow Keys to walk around the house. Move mouse to look. Catch the tiny man or grab the dropped applications!</div>

    <!-- Include Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd7ccc8); // Cozy indoor wall color

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5); // Human eye-level height

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xfffaed, 1, 50);
        pointLight.position.set(0, 4, 0);
        scene.add(pointLight);

        // House Floor (Wooden look)
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Add a table in the room for hiding spots
        const tableGroup = new THREE.Group();
        const tabletopMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
        const topMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 3), tabletopMat);
        topMesh.position.y = 1.5;
        tableGroup.add(topMesh);
        
        // Table legs
        for (let x of [-1.8, 1.8]) {
            for (let z of [-1.3, 1.3]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), tabletopMat);
                leg.position.set(x, 0.75, z);
                tableGroup.add(leg);
            }
        }
        scene.add(tableGroup);
        tableGroup.position.set(0, 0, -5);

        // 2. Build the Tiny Man Character
        const tinyMan = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe53935 }); // Red shirt
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc80 }); // Skin tone
        
        const tinyBody = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.2), bodyMat);
        tinyBody.position.y = 0.25;
        tinyMan.add(tinyBody);

        const tinyHead = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), headMat);
        tinyHead.position.y = 0.6;
        tinyMan.add(tinyHead);

        tinyMan.position.set(2, 0, -3);
        scene.add(tinyMan);

        // 3. Job Applications (Collectibles)
        let applications = [];
        function spawnApplication(x, z) {
            const appGeo = new THREE.BoxGeometry(0.4, 0.02, 0.5);
            const appMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // White paper
            const app = new THREE.Mesh(appGeo, appMat);
            app.position.set(x, 0.02, z);
            scene.add(app);
            applications.push(app);
        }

        // Spawn a few initial job applications around the house
        spawnApplication(-3, -2);
        spawnApplication(3, -4);
        spawnApplication(0, -8);

        // Game Variables
        let score = 0;
        let timeLeft = 45;
        let gameOver = false;

        // Timer countdown
        let timerInterval = setInterval(() => {
            if (!gameOver) {
                timeLeft--;
                document.getElementById("timer").innerText = "Time Left: " + timeLeft + "s";
                if (timeLeft <= 0) {
                    gameOver = true;
                    clearInterval(timerInterval);
                }
            }
        }, 1000);

        // 4. First-Person Movement Controls (W/A/S/D)
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        window.addEventListener("keydown", (e) => {
            if (e.key === "w" || e.key === "ArrowUp") moveForward = true;
            if (e.key === "s" || e.key === "ArrowDown") moveBackward = true;
            if (e.key === "a" || e.key === "ArrowLeft") moveLeft = true;
            if (e.key === "d" || e.key === "ArrowRight") moveRight = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "w" || e.key === "ArrowUp") moveForward = false;
            if (e.key === "s" || e.key === "ArrowDown") moveBackward = false;
            if (e.key === "a" || e.key === "ArrowLeft") moveLeft = false;
            if (e.key === "d" || e.key === "ArrowRight") moveRight = false;
        });

        // Mouse Look
        let mouseX = 0, mouseY = 0;
        let rx = 0, ry = 0;
        document.addEventListener("mousemove", (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.002;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.002;
        });

        // 5. Game Loop
        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // Camera looking rotation
            ry -= mouseX * 0.8;
            rx -= mouseY * 0.8;
            rx = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, rx));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = ry;
            camera.rotation.x = rx;
            mouseX = 0; mouseY = 0;

            // Player walking movement
            let speed = 0.08;
            let dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            let sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            if (moveForward) camera.position.addScaledVector(dir, speed);
            if (moveBackward) camera.position.addScaledVector(dir, -speed);
            if (moveLeft) camera.position.addScaledVector(sideDir, speed);
            if (moveRight) camera.position.addScaledVector(sideDir, -speed);

            // Keep player inside the room bounds
            camera.position.x = Math.max(-14, Math.min(14, camera.position.x));
            camera.position.z = Math.max(-14, Math.min(14, camera.position.z));
            camera.position.y = 1.6; // Keep head height steady

            // Tiny Man AI: Scurries around randomly and hides job apps
            tinyMan.position.x += (Math.random() - 0.5) * 0.08;
            tinyMan.position.z += (Math.random() - 0.5) * 0.08;
            tinyMan.rotation.y += 0.05;

            // Tiny man drops a new application occasionally
            if (Math.random() < 0.015) {
                spawnApplication(tinyMan.position.x, tinyMan.position.z);
            }

            // Check if player collects job applications
            for (let i = applications.length - 1; i >= 0; i--) {
                let app = applications[i];
                let dist = camera.position.distanceTo(app.position);
                if (dist < 1.5) {
                    score++;
                    document.getElementById("score").innerText = score;
                    scene.remove(app);
                    applications.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
