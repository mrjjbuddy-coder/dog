<!doctype html>
<html>
<head>
<meta charset="utf8">
<title>Lord Verity, Master of Humanity</title>
<style>
  body { 
    margin: 0; 
    height: 100vh; 
    background: #0a0812; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    font-family: sans-serif; 
    color: #e0d0f0; 
    overflow: hidden; 
  }
  .container { 
    text-align: center; 
    background: rgba(20, 15, 30, 0.9); 
    padding: 30px; 
    border-radius: 16px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  }
  img { 
    width: 280px; 
    height: 280px; 
    object-fit: cover; 
    border-radius: 12px; 
    border: 2px solid #3a2550; 
    box-shadow: 0 0 20px rgba(100, 20, 150, 0.5);
    margin-bottom: 20px; 
  }
  h1 { margin: 0 0 10px 0; font-size: 1.8rem; letter-spacing: 1px; color: #d4b5ff; }
  p { color: #8c7aab; font-size: 0.95rem; margin-bottom: 20px; }
  .play-btn { 
    padding: 14px 32px; 
    background: #5a2e8c; 
    color: #fff; 
    border: none; 
    border-radius: 999px; 
    font-size: 1rem; 
    font-weight: bold; 
    cursor: pointer; 
    transition: background 0.2s, transform 0.1s; 
    box-shadow: 0 4px 15px rgba(90, 46, 140, 0.4);
  }
  .play-btn:hover { background: #6c37a6; }
  .play-btn:active { transform: scale(0.97); }
  /* Hidden iframe so the YouTube audio plays in the background */
  #ytPlayer { display: none; }
</style>
</head>
<body>

<!-- Hidden YouTube Player: Replace YOUR_YOUTUBE_VIDEO_ID with the actual code from your YouTube video link -->
<iframe id="ytPlayer" src="https://www.youtube.com/embed/YOUR_YOUTUBE_VIDEO_ID?enablejsapi=1&autoplay=0&loop=1" allow="autoplay"></iframe>

<div class="container">
  <!-- Creepy image -->
  <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80" alt="Creepy Lord Verity">
  <h1>Lord Verity</h1>
  <p>Master of Humanity</p>
  <button class="play-btn" id="playBtn">Play Song</button>
</div>

<script>
  const playBtn = document.getElementById('playBtn');
  const iframe = document.getElementById('ytPlayer');
  let isPlaying = false;

  playBtn.addEventListener('click', function() {
    if (!isPlaying) {
      // Tells the hidden YouTube player to play
      iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
      playBtn.textContent = "Pause Song";
      isPlaying = true;
    } else {
      // Stops the player
      iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0');
      playBtn.textContent = "Play Song";
      isPlaying = false;
    }
  });
</script>

</body>
</html>
