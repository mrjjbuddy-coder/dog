<!doctype html>
<html>
<head>
<meta charset="utf8">
<title>Lord Verity, Master of Humanity</title>
<style>
  body { 
    margin: 0; 
    height: 100vh; 
    background: #0a0812; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    font-family: sans-serif; 
    color: #e0d0f0; 
  }
  .container { 
    text-align: center; 
    background: rgba(20, 15, 30, 0.9); 
    padding: 30px; 
    border-radius: 16px; 
    border: 1px solid rgba(255, 255, 255, 0.15); 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  }
  img { 
    width: 240px; 
    height: 240px; 
    object-fit: cover; 
    border-radius: 12px; 
    border: 2px solid #3a2550; 
    box-shadow: 0 0 25px rgba(100, 20, 150, 0.6);
    margin-bottom: 20px; 
  }
  h1 { margin: 0 0 5px 0; font-size: 1.8rem; color: #d4b5ff; }
  p { color: #8c7aab; font-size: 0.95rem; margin-bottom: 20px; }
  iframe { 
    width: 300px; 
    height: 170px; 
    border-radius: 8px; 
    border: 2px solid #3a2550; 
  }
</style>
</head>
<body>

<div class="container">
  <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80" alt="Lord Verity">
  <h1>Lord Verity</h1>
  <p>Master of Humanity</p>
  
  <!-- Replace YOUR_YOUTUBE_VIDEO_ID with the actual code from your YouTube link (e.g. dQw4w9WgXcQ) -->
  <iframe src="https://www.youtube.com/embed/YOUR_YOUTUBE_VIDEO_ID" allow="autoplay"></iframe>
</div>

</body>
</html>
