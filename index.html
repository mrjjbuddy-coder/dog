<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Zombie Outbreak Arena</title>
<style>
  :root {
    --bg: #0b0914;
    --panel: rgba(20, 16, 32, 0.9);
    --accent: #ff3838;
    --accent-glow: rgba(255, 56, 56, 0.5);
    --text: #f8f5ff;
    --text-muted: #9e93b8;
    --border: rgba(255, 255, 255, 0.15);
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  
  /* HUD Layer */
  .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
  
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 14px; padding: 12px 20px; pointer-events: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-weight: 700; font-size: 1rem;
  }
  .stats-grid { display: flex; gap: 20px; }
  .stat-item span { color: var(--text-muted); font-size: 0.8rem; display: block; }
  .stat-item b { font-size: 1.2rem; color: #fff; }

  /* Mobile Joysticks */
  .joystick-zone { position: absolute; left: 30px; bottom: 30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.15); pointer-events: auto; display: none; }
  .joystick-knob { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.3); top: 40px; left: 40px; pointer-events: none; }

  /* Main Menu Overlay */
  .modal {
    position: absolute; inset: 0; background: rgba(8, 6, 14, 0.95); backdrop-filter: blur(20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 24px; text-align: center; transition: opacity 0.3s;
  }
  .modal.hidden { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 900; margin: 0 0 10px 0; color: #fff; text-shadow: 0 4px 20px var(--accent-glow); }
  .title span { color: var(--accent); }
  .desc { max-width: 42ch; color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 28px; }
  
  .btn {
    background: var(--accent); border: none; color: #fff; padding: 16px 40px;
    border-radius: 999px; font-weight: 900; font-size: 1.2rem; cursor: pointer;
    box-shadow: 0 8px 25px var(--accent-glow); transition: transform 0.1s, background 0.2s;
  }
  .btn:hover { background: #ff4d4d; }
  .btn:active { transform: scale(0.95); }

  @media (pointer: coarse) { .joystick-zone { display: block; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud" id="hud" style="display: none;">
  <div class="hud-top">
    <div class="panel stats-grid">
      <div class="stat-item"><span>HEALTH</span><b id="hp-val" style="color: #2ed573;">100</b></div>
      <div class="stat-item"><span>AMMO</span><b id="ammo-val">30 / 30</b></div>
      <div class="stat-item"><span>SCORE</span><b id="score-val">0</b></div>
    </div>
    <div class="panel">
      <span style="color: var(--text-muted); font-size: 0.75rem; display: block;">WAVE</span>
      <b id="wave-val" style="font-size: 1.3rem; color: var(--accent);">1</b>
    </div>
  </div>
</div>

<div class="joystick-zone" id="joy-zone"><div class="joystick-knob" id="joy-knob"></div></div>

<div class="modal" id="menu">
  <h1 class="title">3D ZOMBIE <span>ARENA</span></h1>
  <p class="desc">Fully 3D arcade survival. Move with WASD, aim and click to shoot 3D bullets, and survive incoming waves of the undead!</p>
  <button class="btn" id="start-btn">PLAY 3D GAME</button>
</div>

<script>
(function() {
  const container = document.getElementById('canvas-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0914);
  scene.fog = new THREE.FogExp2(0x0b0914, 0.02);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 22, 16);
  camera.lookAt(0, 0, 0);

  // Lighting
  scene.add(new THREE.HemisphereLight(0xffffff, 0x332244, 0.7));
  const sun = new THREE.DirectionalLight(0xfff3e0, 0.8);
  sun.position.set(15, 25, 15);
  sun.castShadow = true;
  scene.add(sun);

  // Arena Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshLambertMaterial({ color: 0x181424 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Arena Wall boundary boxes
  function makeWall(w, h, d, x, z) {
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: 0x241d38 })
    );
    wall.position.set(x, h/2, z);
    wall.castShadow = true; wall.receiveShadow = true;
    scene.add(wall);
  }
  makeWall(60, 3, 2, 0, -30);
  makeWall(60, 3, 2, 0, 30);
  makeWall(2, 3, 60, -30, 0);
  makeWall(2, 3, 60, 30, 0);

  // Player Mesh (3D Group)
  const playerGroup = new THREE.Group();
  scene.add(playerGroup);

  const bodyMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.6, 1.2, 16),
    new THREE.MeshLambertMaterial({ color: 0x58cc02 })
  );
  bodyMesh.position.y = 0.6;
  bodyMesh.castShadow = true;
  playerGroup.add(bodyMesh);

  const headMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshLambertMaterial({ color: 0xf1c9a5 })
  );
  headMesh.position.y = 1.4;
  headMesh.castShadow = true;
  playerGroup.add(headMesh);

  // Audio Context for Sound Effects
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(90, t);
        osc.frequency.linearRampToValueAtTime(30, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.16);
      }
    } catch(e) {}
  }

  // Game State
  let gameRunning = false;
  let score = 0, wave = 1;
  let player = {
    x: 0, z: 0, speed: 0.18, hp: 100, maxHp: 100,
    ammo: 30, maxAmmo: 30, reloading: false
  };

  let zombies = [];
  let bullets = [];
  let drops = [];

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') reloadGun(); });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // Raycasting for 3D Aiming from Mouse
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let mouseWorldPos = new THREE.Vector3();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    raycaster.ray.intersectPlane(plane, mouseWorldPos);
  });

  let mouseDown = false;
  window.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

  function reloadGun() {
    if (player.reloading || player.ammo === player.maxAmmo) return;
    player.reloading = true;
    setTimeout(() => {
      player.ammo = player.maxAmmo;
      player.reloading = false;
      updateHUD();
    }, 1200);
  }

  function spawnWave() {
    const count = 4 + wave * 3;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 24 + Math.random() * 6;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      // Create 3D Zombie Mesh
      const zMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 1.4, 12),
        new THREE.MeshLambertMaterial({ color: 0x228b22 })
      );
      zMesh.position.set(x, 0.7, z);
      zMesh.castShadow = true;
      scene.add(zMesh);

      zombies.push({
        mesh: zMesh,
        speed: 0.05 + Math.random() * 0.02 + (wave * 0.005),
        hp: 30 + (wave * 10)
      });
    }
  }

  function updateHUD() {
    document.getElementById('hp-val').textContent = Math.max(0, Math.round(player.hp));
    document.getElementById('ammo-val').textContent = player.reloading ? 'RELOADING...' : `${player.ammo} / ${player.maxAmmo}`;
    document.getElementById('score-val').textContent = score;
    document.getElementById('wave-val').textContent = wave;
  }

  let lastShoot = 0;
  function shootBullet() {
    if (player.reloading || player.ammo <= 0) { if (player.ammo <= 0) reloadGun(); return; }
    const now = performance.now();
    if (now - lastShoot < 150) return;
    lastShoot = now;

    player.ammo--;
    playSound('shoot');
    updateHUD();

    const bulletMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffe600 })
    );
    bulletMesh.position.set(player.x, 1.0, player.z);
    scene.add(bulletMesh);

    const angle = Math.atan2(mouseWorldPos.x - player.x, mouseWorldPos.z - player.z);
    bullets.push({
      mesh: bulletMesh,
      vx: Math.sin(angle) * 0.8,
      vz: Math.cos(angle) * 0.8,
      life: 60
    });
  }

  // Mobile joystick variables
  let joyActive = false, joyVector = { x: 0, z: 0 };
  const joyZone = document.getElementById('joy-zone');
  const joyKnob = document.getElementById('joy-knob');
  let joyTouchId = null, joyOrigin = { x: 0, y: 0 };

  joyZone.addEventListener('touchstart', e => {
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    const rect = joyZone.getBoundingClientRect();
    joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    joyActive = true;
  });

  joyZone.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyTouchId) {
        const dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
        const dist = Math.hypot(dx, dy), maxDist = 45, angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);
        joyKnob.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
        joyVector.x = Math.cos(angle) * (clampedDist / maxDist);
        joyVector.z = Math.sin(angle) * (clampedDist / maxDist);
      }
    }
  });

  function endTouch(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyTouchId = null; joyActive = false;
        joyKnob.style.transform = `translate(0px, 0px)`;
        joyVector.x = 0; joyVector.z = 0;
      }
    }
  }
  joyZone.addEventListener('touchend', endTouch);
  joyZone.addEventListener('touchcancel', endTouch);

  // Game Loop
  function update() {
    if (!gameRunning) return;

    // Player Movement
    let dx = 0, dz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 && dz !== 0) { dx *= 0.7071; dz *= 0.7071; }

    if (joyActive) {
      player.x += joyVector.x * player.speed * 1.5;
      player.z += joyVector.z * player.speed * 1.5;
    } else {
      player.x += dx * player.speed;
      player.z += dz * player.speed;
    }

    // Boundaries
    player.x = Math.max(-27, Math.min(27, player.x));
    player.z = Math.max(-27, Math.min(27, player.z));

    playerGroup.position.set(player.x, 0, player.z);
    playerGroup.rotation.y = Math.atan2(mouseWorldPos.x - player.x, mouseWorldPos.z - player.z);

    if (mouseDown) shootBullet();

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.mesh.position.x += b.vx;
      b.mesh.position.z += b.vz;
      b.life--;

      if (b.life <= 0) {
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        continue;
      }

      // Check collision with zombies
      for (let j = zombies.length - 1; j >= 0; j--) {
        let z = zombies[j];
        if (b.mesh.position.distanceTo(z.mesh.position) < 1.0) {
          z.hp -= 25;
          scene.remove(b.mesh);
          bullets.splice(i, 1);

          if (z.hp <= 0) {
            scene.remove(z.mesh);
            zombies.splice(j, 1);
            score += 100;
            if (zombies.length === 0) {
              wave++;
              spawnWave();
            }
          }
          break;
        }
      }
    }

    // Update Zombies
    for (let z of zombies) {
      const angle = Math.atan2(player.x - z.mesh.position.x, player.z - z.mesh.position.z);
      z.mesh.position.x += Math.sin(angle) * z.speed;
      z.mesh.position.z += Math.cos(angle) * z.speed;

      // Damage player
      if (z.mesh.position.distanceTo(playerGroup.position) < 1.2) {
        player.hp -= 0.6;
        playSound('hit');
        updateHUD();
        if (player.hp <= 0) {
          gameRunning = false;
          document.getElementById('menu').classList.remove('hidden');
          document.getElementById('hud').style.display = 'none';
        }
      }
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
  }
  animate();

  document.getElementById('start-btn').addEventListener('click', () => {
    player.hp = 100; player.ammo = 30; score = 0; wave = 1;
    zombies.forEach(z => scene.remove(z.mesh));
    bullets.forEach(b => scene.remove(b.mesh));
    zombies = []; bullets = [];
    spawnWave();
    gameRunning = true;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    updateHUD();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
</html>
