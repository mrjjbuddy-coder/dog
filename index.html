<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grow a Garden Simulator</title>
<style>
  :root {
    --bg: #1e1b2e;
    --panel: rgba(24, 20, 37, 0.92);
    --primary: #58cc02;
    --accent: #ffb703;
    --border: rgba(255, 255, 255, 0.15);
    --text: #ffffff;
    --text-muted: #b8b0cc;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; z-index: 10; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }

  .currencies { display: flex; gap: 12px; pointer-events: auto; }
  .currency-pill {
    background: var(--panel); border: 2px solid var(--border);
    padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 1.05rem;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px); color: var(--accent);
  }

  .nav-buttons { display: flex; gap: 10px; pointer-events: auto; }
  .nav-btn {
    background: #6c5ce7; border: none; color: #fff; padding: 10px 18px;
    border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 0.9rem;
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); transition: transform 0.1s, background 0.2s;
  }
  .nav-btn:hover { background: #5b4bc4; }
  .nav-btn:active { transform: scale(0.95); }

  /* Seed Inventory Hotbar at Bottom */
  .hotbar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; background: var(--panel); padding: 10px; border-radius: 20px;
    border: 2px solid var(--border); pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .seed-slot {
    width: 60px; height: 60px; border-radius: 14px; background: rgba(255,255,255,0.05);
    border: 2px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: transform 0.1s, border-color 0.1s;
  }
  .seed-slot.active { border-color: var(--primary); transform: scale(1.1); box-shadow: 0 0 15px rgba(88, 204, 2, 0.5); }
  .seed-slot span { font-size: 1.5rem; }
  .seed-cost { position: absolute; bottom: 2px; font-size: 0.65rem; color: var(--accent); font-weight: bold; }

  /* Modals */
  .modal {
    position: absolute; inset: 0; background: rgba(10, 8, 18, 0.85); backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--panel); border: 2px solid var(--border); border-radius: 20px;
    width: 90%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7); overflow: hidden;
  }
  .modal-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .modal-header h2 { margin: 0; font-size: 1.4rem; color: #fff; }
  .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
  .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

  /* List items */
  .shop-item, .pet-card {
    background: rgba(255,255,255,0.04); border: 2px solid var(--border); border-radius: 12px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .item-info { display: flex; align-items: center; gap: 12px; }
  .item-icon { font-size: 2rem; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; }

  /* Toast Notification */
  .toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: var(--panel); border: 1px solid var(--border); padding: 10px 24px;
    border-radius: 30px; font-weight: 700; font-size: 0.95rem; opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: var(--accent);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud">
  <div class="hud-top">
    <div class="currencies">
      <div class="currency-pill">🪙 <span id="coin-count">100</span></div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" id="btn-shop">Shop</button>
      <button class="nav-btn" id="btn-pets">Pets</button>
    </div>
  </div>

  <div class="hotbar" id="hotbar"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Shop Modal -->
<div class="modal" id="modal-shop">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Seed & Tool Shop</h2>
      <button class="close-btn" onclick="closeModals()">×</button>
    </div>
    <div class="modal-body" id="shop-list"></div>
  </div>
</div>

<!-- Pets Modal -->
<div class="modal" id="modal-pets">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Garden Pets</h2>
      <button class="close-btn" onclick="closeModals()">×</button>
    </div>
    <div class="modal-body">
      <div style="text-align: center; margin-bottom: 10px;">
        <div style="font-size: 3rem;">🥚</div>
        <button class="nav-btn" id="hatch-btn" style="margin-top: 10px; width: 100%;">Hatch Egg (150 🪙)</button>
      </div>
      <div id="pets-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  let coins = 100;
  let selectedSeed = 0; // Index in seeds array

  const SEEDS = [
    { name: 'Carrot', emoji: '🥕', cost: 0, growTime: 3, reward: 15, color: 0xff7f50 },
    { name: 'Tomato', emoji: '🍅', cost: 25, growTime: 5, reward: 45, color: 0xff4d4d },
    { name: 'Watermelon', emoji: '🍉', cost: 80, growTime: 8, reward: 150, color: 0x2ed573 },
    { name: 'Gold Apple', emoji: '🍎', cost: 250, growTime: 12, reward: 550, color: 0xffd700 }
  ];

  const PET_TYPES = [
    { id: 'bunny', name: 'Garden Bunny', emoji: '🐰', bonus: '1.2x Coins', mult: 1.2, chance: 0.6 },
    { id: 'bee', name: 'Busy Bee', emoji: '🐝', bonus: '1.5x Coins', mult: 1.5, chance: 0.3 },
    { id: 'gnome', name: 'Golden Gnome', emoji: '🧙‍♂️', bonus: '2.5x Coins', mult: 2.5, chance: 0.1 }
  ];

  let inventory = [];
  let equippedPet = null;

  // Farm Plots Data (3x3 grid = 9 plots)
  const plots = [];
  for (let i = 0; i < 9; i++) {
    plots.push({ state: 'empty', seedIdx: 0, plantedTime: 0, progress: 0, mesh: null });
  }

  // Load Save
  try {
    const saved = localStorage.getItem('grow_garden_save');
    if (saved) {
      const data = JSON.parse(saved);
      coins = data.coins ?? 100;
      inventory = data.inventory ?? [];
      equippedPet = data.equippedPet ?? null;
    }
  } catch(e) {}

  function saveGame() {
    try {
      localStorage.setItem('grow_garden_save', JSON.stringify({ coins, inventory, equippedPet }));
    } catch(e) {}
  }

  function getCoinMultiplier() {
    if (!equippedPet) return 1;
    const p = PET_TYPES.find(t => t.id === equippedPet);
    return p ? p.mult : 1;
  }

  // --- Three.js Setup ---
  const container = document.getElementById('canvas-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // Sky blue
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 14, 12);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x446622, 0.8));
  const sun = new THREE.DirectionalLight(0xfffaed, 0.9);
  sun.position.set(10, 25, 10);
  sun.castShadow = true;
  scene.add(sun);

  // Grass Field Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshLambertMaterial({ color: 0x55a630 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Build Farm Plot Meshes in a 3x3 Grid
  const plotGroup = new THREE.Group();
  scene.add(plotGroup);

  const plotGeo = new THREE.BoxGeometry(2.2, 0.15, 2.2);
  const plotMat = new THREE.MeshLambertMaterial({ color: 0x654321 }); // Brown soil

  plots.forEach((p, idx) => {
    const row = Math.floor(idx / 3);
    const col = idx % 3;
    const x = (col - 1) * 3.0;
    const z = (row - 1) * 3.0 - 1.0;

    const mesh = new THREE.Mesh(plotGeo, plotMat);
    mesh.position.set(x, 0.08, z);
    mesh.receiveShadow = true;
    mesh.userData = { plotIndex: idx };
    plotGroup.add(mesh);
  });

  // Pet 3D Mesh
  const petMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshLambertMaterial({ color: 0xffd700 })
  );
  petMesh.castShadow = true;
  scene.add(petMesh);
  petMesh.visible = false;

  // --- Raycasting for Clicking Plots ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.addEventListener('pointerdown', e => {
    // Ignore UI clicks
    if (e.target.closest('.hud') || e.target.closest('.modal')) return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(plotGroup.children);
    if (intersects.length > 0) {
      const idx = intersects[0].object.userData.plotIndex;
      handlePlotClick(idx);
    }
  });

  function handlePlotClick(idx) {
    const plot = plots[idx];
    const seed = SEEDS[selectedSeed];

    if (plot.state === 'empty') {
      if (coins < seed.cost && seed.cost > 0) {
        showToast("Not enough coins!");
        return;
      }
      if (seed.cost > 0) {
        coins -= seed.cost;
        updateHUD();
        saveGame();
      }
      plot.state = 'growing';
      plot.seedIdx = selectedSeed;
      plot.plantedTime = performance.now();
      plot.progress = 0;
      updatePlotMesh(idx);
    } else if (plot.state === 'ready') {
      const reward = Math.round(seed.reward * getCoinMultiplier());
      coins += reward;
      showToast(`Harvested +${reward} 🪙`);
      plot.state = 'empty';
      updatePlotMesh(idx);
      updateHUD();
      saveGame();
    }
  }

  function updatePlotMesh(idx) {
    const plot = plots[idx];
    const row = Math.floor(idx / 3);
    const col = idx % 3;
    const x = (col - 1) * 3.0;
    const z = (row - 1) * 3.0 - 1.0;

    // Remove old crop mesh if it exists
    if (plot.cropMesh) {
      scene.remove(plot.cropMesh);
      plot.cropMesh = null;
    }

    if (plot.state === 'growing' || plot.state === 'ready') {
      const seed = SEEDS[plot.seedIdx];
      const scale = plot.state === 'ready' ? 1 : 0.4;
      const cropMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 12, 12),
        new THREE.MeshLambertMaterial({ color: seed.color })
      );
      cropMesh.scale.set(scale, scale * 1.5, scale);
      cropMesh.position.set(x, 0.5, z);
      cropMesh.castShadow = true;
      scene.add(cropMesh);
      plot.cropMesh = cropMesh;
    }
  }

  // --- UI & Hotbar ---
  const coinEl = document.getElementById('coin-count');
  function updateHUD() {
    coinEl.textContent = Math.floor(coins).toLocaleString();
    renderHotbar();
  }

  function renderHotbar() {
    const hotbar = document.getElementById('hotbar');
    hotbar.innerHTML = '';
    SEEDS.forEach((seed, i) => {
      const slot = document.createElement('div');
      slot.className = `seed-slot ${i === selectedSeed ? 'active' : ''}`;
      slot.innerHTML = `
        <span>${seed.emoji}</span>
        <div class="seed-cost">${seed.cost === 0 ? 'FREE' : seed.cost + '🪙'}</div>
      `;
      slot.addEventListener('click', () => {
        selectedSeed = i;
        renderHotbar();
      });
      hotbar.appendChild(slot);
    });
  }
  updateHUD();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Modals
  window.closeModals = function() {
    document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  };

  document.getElementById('btn-shop').addEventListener('click', () => {
    renderShop();
    document.getElementById('modal-shop').classList.add('open');
  });

  document.getElementById('btn-pets').addEventListener('click', () => {
    renderPets();
    document.getElementById('modal-pets').classList.add('open');
  });

  function renderShop() {
    const list = document.getElementById('shop-list');
    list.innerHTML = '';
    SEEDS.forEach((seed, idx) => {
      const item = document.createElement('div');
      item.className = 'shop-item';
      item.innerHTML = `
        <div class="item-info">
          <div class="item-icon">${seed.emoji}</div>
          <div>
            <div style="font-weight: bold;">${seed.name} Seed</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Grow time: ${seed.growTime}s | Sells for: ${seed.reward}🪙</div>
          </div>
        </div>
        <button class="nav-btn" style="padding: 8px 14px;">Select</button>
      `;
      item.querySelector('button').addEventListener('click', () => {
        selectedSeed = idx;
        renderHotbar();
        closeModals();
        showToast(`Equipped ${seed.name} seeds!`);
      });
      list.appendChild(item);
    });
  }

  // Pet Hatching
  document.getElementById('hatch-btn').addEventListener('click', () => {
    const cost = 150;
    if (coins < cost) {
      showToast("Need 150 🪙 to hatch an egg!");
      return;
    }
    coins -= cost;
    updateHUD();

    const rand = Math.random();
    let cumulative = 0;
    let chosen = PET_TYPES[0];
    for (let p of PET_TYPES) {
      cumulative += p.chance;
      if (rand <= cumulative) {
        chosen = p;
        break;
      }
    }

    inventory.push(chosen.id);
    equippedPet = chosen.id;
    saveGame();
    renderPets();
    petMesh.visible = true;
    showToast(`Hatched a ${chosen.name}! 🎉`);
  });

  function renderPets() {
    const list = document.getElementById('pets-list');
    list.innerHTML = '';
    if (inventory.length === 0) {
      list.innerHTML = '<div style="color: var(--text-muted); text-align: center;">No pets hatched yet! Hatch an egg above.</div>';
      return;
    }
    inventory.forEach((petId, idx) => {
      const p = PET_TYPES.find(t => t.id === petId);
      const isEq = equippedPet === petId;
      const card = document.createElement('div');
      card.className = 'pet-card';
      card.innerHTML = `
        <div class="item-info">
          <div class="item-icon">${p.emoji}</div>
          <div>
            <div style="font-weight: bold;">${p.name}</div>
            <div style="font-size: 0.8rem; color: var(--accent);">Bonus: ${p.bonus}</div>
          </div>
        </div>
        <button class="nav-btn" style="background: ${isEq ? '#2ed573' : '#6c5ce7'}; padding: 6px 14px;">${isEq ? 'Equipped' : 'Equip'}</button>
      `;
      card.querySelector('button').addEventListener('click', () => {
        equippedPet = petId;
        petMesh.visible = true;
        saveGame();
        renderPets();
      });
      list.appendChild(card);
    });
  }

  // --- Animation Loop ---
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const time = clock.getElapsedTime();

    // Check Crop Growth Progress
    plots.forEach((plot, idx) => {
      if (plot.state === 'growing') {
        const seed = SEEDS[plot.seedIdx];
        const elapsed = (now - plot.plantedTime) / 1000;
        if (elapsed >= seed.growTime) {
          plot.state = 'ready';
          updatePlotMesh(idx);
        }
      }
    });

    // Animate Pet orbiting the farm
    if (equippedPet) {
      petMesh.visible = true;
      const angle = time * 2;
      petMesh.position.x = Math.cos(angle) * 5;
      petMesh.position.z = Math.sin(angle) * 5;
      petMesh.position.y = 0.5 + Math.sin(time * 6) * 0.15;
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
</html>
