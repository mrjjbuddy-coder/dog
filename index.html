
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUSH 3D</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; overflow: hidden; background: #08051b;
    font-family: Arial, sans-serif; color: white;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 18px; left: 18px; right: 18px;
    display: flex; justify-content: space-between;
    gap: 10px; pointer-events: none; z-index: 2;
  }
  .panel {
    background: #100b2ddd; border: 1px solid #7e5cff;
    border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 0 20px #743cff55;
  }
  #score { font-size: 24px; font-weight: bold; color: #54faff; }
  #message {
    position: fixed; inset: 0; display: grid;
    place-items: center; text-align: center; z-index: 3;
    background: #07041a88;
  }
  #card {
    padding: 30px; max-width: 440px; margin: 18px;
    background: #100b2df2; border: 1px solid #54faff;
    border-radius: 24px; box-shadow: 0 0 45px #6a30ff66;
  }
  h1 { font-size: clamp(34px, 8vw, 58px); margin: 0 0 12px;
       color: #54faff; text-shadow: 0 0 22px #00d9ff; }
  button {
    padding: 15px 26px; border: 0; border-radius: 12px;
    color: #09051a; background: #54faff;
    font-size: 18px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #b3fcff; transform: scale(1.04); }
  #help { position: fixed; bottom: 15px; left: 0; right: 0;
    text-align: center; color: white; text-shadow: 0 2px 8px black;
    font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div class="panel">💎 SCORE <div id="score">0</div></div>
  <div class="panel">❤️ LIVES <div id="lives">3</div></div>
  <div class="panel">⚡ SPEED <div id="speed">1.0x</div></div>
</div>

<div id="message">
  <div id="card">
    <h1>NEON RUSH</h1>
    <p>Welcome to the neon dimension! 🌌</p>
    <p>Collect gems, dodge deadly blocks, and survive as the world gets faster.</p>
    <p>⬅️ ➡️ Switch lanes<br>⬆️ or SPACE to jump</p>
    <button id="start">LET'S PLAY 🚀</button>
  </div>
</div>
<div id="help">A / D or ← / → to move · SPACE / ↑ to jump · P to pause</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08051b);
scene.fog = new THREE.Fog(0x08051b, 28, 115);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 180
);
camera.position.set(0, 6, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8dbbff, 0x170521, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(-5, 12, 7);
light.castShadow = true;
scene.add(light);

const pinkLight = new THREE.PointLight(0xff00cc, 35, 35);
pinkLight.position.set(0, 5, -10);
scene.add(pinkLight);

const cyanLight = new THREE.PointLight(0x00eaff, 30, 30);
cyanLight.position.set(7, 4, -20);
scene.add(cyanLight);

const mats = {
  floor: new THREE.MeshStandardMaterial({
    color: 0x15102f, metalness: 0.7, roughness: 0.35
  }),
  cyan: new THREE.MeshStandardMaterial({
    color: 0x00f5ff, emissive: 0x00bccc,
    emissiveIntensity: 2, metalness: 0.4, roughness: 0.2
  }),
  pink: new THREE.MeshStandardMaterial({
    color: 0xff20c8, emissive: 0xcc0088,
    emissiveIntensity: 1.8, metalness: 0.3, roughness: 0.25
  }),
  gold: new THREE.MeshStandardMaterial({
    color: 0xffd83d, emissive: 0xff9900,
    emissiveIntensity: 1.6, metalness: 0.7, roughness: 0.2
  }),
  block: new THREE.MeshStandardMaterial({
    color: 0x7b2cff, emissive: 0x4a00bb,
    emissiveIntensity: 1.1, metalness: 0.45, roughness: 0.25
  })
};

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(13, 180),
  mats.floor
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, -0.12, -55);
floor.receiveShadow = true;
scene.add(floor);

// Glowing road edges and lane markers
const lines = [];
for (const x of [-6, -2, 2, 6]) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.035, 180),
    mats.cyan
  );
  line.position.set(x, -0.07, -55);
  scene.add(line);
}
for (let z = 10; z > -130; z -= 5) {
  for (const x of [-1.33, 1.33]) {
    const mark = new THREE.Mesh(
      new THREE.BoxGeometry(0.035, 0.025, 2.2), mats.pink
    );
    mark.position.set(x, -0.055, z);
    scene.add(mark);
    lines.push(mark);
  }
}

// Futuristic skyline
const buildings = [];
for (let i = 0; i < 65; i++) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const h = 3 + Math.random() * 17;
  const w = 1.5 + Math.random() * 3;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, 2 + Math.random() * 4),
    new THREE.MeshStandardMaterial({
      color: 0x15133b,
      emissive: Math.random() < 0.5 ? 0x230c6c : 0x082b55,
      emissiveIntensity: 1.2,
      metalness: 0.65, roughness: 0.3
    })
  );
  mesh.position.set(side * (8 + Math.random() * 14),
                   h / 2 - 0.2, -Math.random() * 130);
  scene.add(mesh);
  buildings.push(mesh);
}

// Player robot
const player = new THREE.Group();
scene.add(player);

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.85, 1.05, 0.65), mats.block
);
body.position.y = 1.0;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.BoxGeometry(0.72, 0.55, 0.7), mats.cyan
);
head.position.y = 1.82;
head.castShadow = true;
player.add(head);

const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (const x of [-0.18, 0.18]) {
  const eye = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.09, 0.04), eyeMat
  );
  eye.position.set(x, 1.87, -0.36);
  player.add(eye);
}

const legs = [];
for (const x of [-0.24, 0.24]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.55, 0.28), mats.pink
  );
  leg.position.set(x, 0.35, 0);
  leg.castShadow = true;
  player.add(leg);
  legs.push(leg);
}

player.position.set(0, 0, 3);

// Game objects
const objects = [];
const lanes = [-4, 0, 4];
let score = 0, lives = 3, speed = 22;
let running = false, paused = false, ended = false;
let lane = 1, jumpY = 0, jumpV = 0;
let spawnTimer = 0, boostTimer = 0, hitCooldown = 0;
let lastTime = 0;

function addObject(type, x, z) {
  let mesh;
  if (type === 'gem') {
    mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.58), mats.gold
    );
  } else if (type === 'boost') {
    mesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.7, 0.16, 8, 20), mats.cyan
    );
  } else {
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.7, 1.25), mats.pink
    );
    // Decorative glowing obstacle core
    const core = new THREE.Mesh(
      new THREE.BoxGeometry(0.85, 0.85, 0.85), mats.block
    );
    mesh.add(core);
    core.position.z = -0.67;
  }
  mesh.position.set(x, type === 'obstacle' ? 0.85 : 1.25, z);
  mesh.castShadow = true;
  scene.add(mesh);
  objects.push({ mesh, type, hit: false });
}

function spawnWave() {
  const r = Math.random();
  const obstacleLane = Math.floor(Math.random() * 3);
  const z = -80;

  if (r < 0.52) {
    addObject('obstacle', lanes[obstacleLane], z);
    // Gem trail in another lane
    const other = lanes[(obstacleLane + 1 + Math.floor(Math.random() * 2)) % 3];
    for (let i = 0; i < 4; i++) addObject('gem', other, z - 7 - i * 3);
  } else if (r < 0.9) {
    const gemLane = lanes[Math.floor(Math.random() * 3)];
    for (let i = 0; i < 6; i++) addObject('gem', gemLane, z - i * 3);
  } else {
    addObject('boost', lanes[Math.floor(Math.random() * 3)], z);
    addObject('gem', lanes[1], z - 7);
  }
}

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const speedEl = document.getElementById('speed');
const message = document.getElementById('message');
const card = document.getElementById('card');

function updateHUD() {
  scoreEl.textContent = Math.floor(score);
  livesEl.textContent = '❤️ '.repeat(lives).trim() || '0';
  speedEl.textContent = (speed / 22).toFixed(1) + 'x';
}

function startGame() {
  for (const o of objects) scene.remove(o.mesh);
  objects.length = 0;
  score = 0;
  lives = 3;
  speed = 22;
  lane = 1;
  jumpY = 0;
  jumpV = 0;
  spawnTimer = 0.5;
  boostTimer = 0;
  hitCooldown = 0;
  player.position.set(0, 0, 3);
  running = true;
  paused = false;
  ended = false;
  message.style.display = 'none';
  updateHUD();
}

function gameOver() {
  running = false;
  ended = true;
  card.innerHTML = `
    <h1>GAME OVER!</h1>
    <p>✨ Final score: <b>${Math.floor(score)}</b></p>
    <p>${score >= 300 ? 'NEON LEGEND! 🌟' : 'The neon world awaits your comeback!'}</p>
    <button id="start">PLAY AGAIN 🚀</button>`;
  message.style.display = 'grid';
  document.getElementById('start').onclick = startGame;
}

document.getElementById('start').onclick = startGame;

function moveLane(direction) {
  if (!running || paused) return;
  lane = THREE.MathUtils.clamp(lane + direction, 0, 2);
}

function jump() {
  if (!running || paused || jumpY > 0.05) return;
  jumpV = 10.5;
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(e.key))
    e.preventDefault();
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveLane(-1);
  if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveLane(1);
  if (e.key === 'ArrowUp' || e.key === ' ') jump();
  if (e.key.toLowerCase() === 'p' && running) paused = !paused;
});

let touchX = null;
addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
}, { passive: true });

addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 35) moveLane(dx > 0 ? 1 : -1);
  else jump();
  touchX = null;
}, { passive: true });

function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time - lastTime) / 1000 || 0, 0.04);
  lastTime = time;

  if (running && !paused) {
    score += dt * 2;
    speed = Math.min(42, speed + dt * 0.16);
    if (boostTimer > 0) {
      boostTimer -= dt;
      speed = 34;
    }
    hitCooldown = Math.max(0, hitCooldown - dt);

    // Smooth lane switching
    player.position.x = THREE.MathUtils.damp(
      player.position.x, lanes[lane], 12, dt
    );

    // Jump physics
    jumpV -= 25 * dt;
    jumpY += jumpV * dt;
    if (jumpY < 0) {
      jumpY = 0;
      jumpV = 0;
    }
    player.position.y = jumpY;

    // Running animation
    legs.forEach((leg, i) => {
      leg.rotation.x = jumpY > 0.05 ? 0 :
        Math.sin(time * 0.015 + i * Math.PI) * 0.65;
    });
    body.rotation.z = Math.sin(time * 0.008) * 0.045;
    head.rotation.y = Math.sin(time * 0.004) * 0.08;

    // Objects move toward the player
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnWave();
      spawnTimer = Math.max(0.48, 1.05 - score / 250);
    }

    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      o.mesh.position.z += speed * dt;
      o.mesh.rotation.y += dt * 2.5;

      const dx = Math.abs(o.mesh.position.x - player.position.x);
      const dz = Math.abs(o.mesh.position.z - 3);
      const close = dx < 1.35 && dz < 1.15;

      if (close && o.type === 'gem') {
        score += 25;
        scene.remove(o.mesh);
        objects.splice(i, 1);
        continue;
      }
      if (close && o.type === 'boost') {
        boostTimer = 2.5;
        score += 50;
        scene.remove(o.mesh);
        objects.splice(i, 1);
        continue;
      }
      if (close && o.type === 'obstacle' &&
          jumpY < 1.05 && hitCooldown <= 0 && !o.hit) {
        lives--;
        hitCooldown = 1.1;
        o.hit = true;
        scene.remove(o.mesh);
        objects.splice(i, 1);
        updateHUD();
        if (lives <= 0) {
          gameOver();
          break;
        }
        continue;
      }
      if (o.mesh.position.z > 15) {
        scene.remove(o.mesh);
        objects.splice(i, 1);
      }
    }

    // Endless glowing floor markers
    lines.forEach(line => {
      line.position.z += speed * dt;
      if (line.position.z > 12) line.position.z -= 140;
    });

    // Recycle buildings for an endless city
    buildings.forEach(b => {
      b.position.z += speed * dt * 0.72;
      if (b.position.z > 18) {
        b.position.z -= 135;
        b.position.y = 2 + Math.random() * 16;
      }
    });

    camera.position.x = THREE.MathUtils.damp(
      camera.position.x, player.position.x * 0.25, 3, dt
    );
    camera.lookAt(player.position.x * 0.2, 1.3, -5);
    updateHUD();
  } else if (paused) {
    camera.lookAt(player.position.x * 0.2, 1.3, -5);
  }

  // Animated neon lights
  pinkLight.position.x = Math.sin(time * 0.0007) * 7;
  cyanLight.position.x = Math.cos(time * 0.0009) * 7;

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
