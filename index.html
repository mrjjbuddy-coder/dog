<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px sans-serif;background:#241f3a;color:#fff3dc;overflow:hidden}</style></head><body>
<title>Pawsession - Enhanced</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .obj { max-width: 320px; padding: 12px; border-radius: 12px; background: rgba(30, 26, 50, 0.85); border: 1px solid rgba(255,243,220,0.2); }
  .obj-t { font-weight: 800; font-size: 1rem; }
  .obj-h { font-size: 0.8rem; color: #bdb4d8; margin-top: 4px; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(36, 31, 58, 0.95); z-index: 100; text-align: center; padding: 20px; }
  .go { padding: 14px 32px; border: 0; border-radius: 999px; background: #ffd35e; color: #2a2208; font-weight: 800; font-size: 1.1rem; cursor: pointer; }
  #joyZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 60%; touch-action: none; }
  .act { position: absolute; right: 25px; bottom: 45px; width: 80px; height: 80px; border-radius: 50%; background: #ffd35e; color: #2a2208; font-weight: 800; border: none; font-size: 1rem; cursor: pointer; z-index: 50; }
  .toast { position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%); padding: 8px 14px; background: rgba(30,26,50,0.9); border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <div class="hud">
    <div class="obj"><div class="obj-t" id="objT">Objective</div><div class="obj-h" id="objH">Follow Biscuit through the house!</div></div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="joyZone"></div>
  <button class="act" id="actBtn" type="button">Turn</button>

  <div class="screen" id="startScreen">
    <h1>Pawsession: Enhanced</h1>
    <p>Biscuit took your phone into the house! Drag on the left side to move, tap pillars to turn them.</p>
    <button class="go" id="startBtn" type="button">Start Game</button>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage'), canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.shadowMap.enabled = true;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x241f3a);

  var camera = new THREE.PerspectiveCamera(50, stage.clientWidth / stage.clientHeight, 0.5, 140);
  camera.position.set(3, 14, 22);
  camera.lookAt(3, 0, 5);

  scene.add(new THREE.HemisphereLight(0xfff3e0, 0x6b5b8a, 0.9));
  var sun = new THREE.DirectionalLight(0xffe7c2, 0.8);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  scene.add(sun);

  // Detailed floor and walls setup
  function box(w, h, d, c, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
    scene.add(m); return m;
  }

  // Environment rooms
  box(12, 0.1, 12, 0x5b3f73, 0, 0, 12); // Living room
  box(12, 0.1, 12, 0x7fc4b8, 0, 0, 0);  // Kitchen
  box(16, 0.1, 15, 0x5f9f4e, 0, 0, -225/10); // Yard

  // Player Character (Detailed Character Model instead of a plain ball)
  var player = new THREE.Group();
  var body = box(0.6, 0.8, 0.4, 0xff6b5b, 0, 0.8, 0);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshLambertMaterial({ color: 0xf1c9a5 }));
  head.position.set(0, 1.5, 0); player.add(head);
  scene.add(player);

  var P = { x: 3, z: 16, face: Math.PI };
  var running = false, input = { x: 0, z: 0 };

  function toast(msg) {
    var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Controls
  document.getElementById('joyZone').addEventListener('pointermove', function(e) {
    var r = stage.getBoundingClientRect();
    var dx = (e.clientX - r.left) - r.width/4, dy = (e.clientY - r.top) - r.height/2;
    var m = Math.hypot(dx, dy);
    input.x = m < 5 ? 0 : dx / 50; input.z = m < 5 ? 0 : dy / 50;
  });
  document.getElementById('joyZone').addEventListener('pointerup', function() { input.x = 0; input.z = 0; });

  document.getElementById('startBtn').addEventListener('click', function() {
    document.getElementById('startScreen').style.display = 'none';
    running = true; toast('Catch Biscuit!');
  });

  function update(dt) {
    if (running) {
      P.x += input.x * 5 * dt; P.z += input.z * 5 * dt;
      if (Math.hypot(input.x, input.z) > 0.1) P.face = Math.atan2(input.x, input.z);
    }
    player.position.set(P.x, 0, P.z);
    player.rotation.y = P.face;
    camera.position.set(P.x, 12, P.z + 12);
    camera.lookAt(P.x, 0, P.z - 2);
  }

  var last = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    update(dt); renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body></html>
