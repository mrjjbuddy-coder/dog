<!doctype html>
<html>
<head>
<meta charset="utf8">
<title>Lord Verity, Master of Humanity</title>
<style>
  body { 
    margin: 0; 
    height: 100vh; 
    background: #0a0812; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    font-family: sans-serif; 
    color: #e0d0f0; 
  }
  .container { 
    text-align: center; 
    background: rgba(20, 15, 30, 0.9); 
    padding: 35px; 
    border-radius: 16px; 
    border: 1px solid rgba(255, 255, 255, 0.15); 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
  }
  img { 
    width: 250px; 
    height: 250px; 
    object-fit: cover; 
    border-radius: 12px; 
    border: 2px solid #3a2550; 
    box-shadow: 0 0 25px rgba(100, 20, 150, 0.6);
    margin-bottom: 20px; 
  }
  h1 { margin: 0 0 5px 0; font-size: 1.8rem; color: #d4b5ff; }
  p { color: #8c7aab; font-size: 0.95rem; margin-bottom: 25px; }
  .link-btn {
    display: inline-block;
    padding: 12px 28px;
    background: #5a2e8c;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: bold;
    font-size: 0.95rem;
    box-shadow: 0 4px 15px rgba(90, 46, 140, 0.4);
    transition: background 0.2s;
  }
  .link-btn:hover { background: #6c37a6; }
</style>
</head>
<body>

<div class="container">
  <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80" alt="Lord Verity">
  <h1>Lord Verity</h1>
  <p>Master of Humanity</p>
  
  <!-- Direct Link to play the audio/video instantly without embed blocks -->
  <a href="https://www.youtube.com/watch?v=YOUR_YOUTUBE_VIDEO_ID" target="_blank" class="link-btn">Play Lord Verity</a>
</div>

</body>
</html>
