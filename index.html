<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombie Outbreak Arena</title>
<style>
  :root {
    --bg: #0b0914;
    --panel: rgba(20, 16, 32, 0.9);
    --accent: #ff3838;
    --accent-glow: rgba(255, 56, 56, 0.5);
    --text: #f8f5ff;
    --text-muted: #9e93b8;
    --border: rgba(255, 255, 255, 0.15);
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  
  /* HUD Layer */
  .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
  .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
  
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 14px; padding: 12px 20px; pointer-events: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-weight: 700; font-size: 1rem;
  }
  .stats-grid { display: flex; gap: 20px; }
  .stat-item span { color: var(--text-muted); font-size: 0.8rem; display: block; }
  .stat-item b { font-size: 1.2rem; color: #fff; }

  /* Mobile Controls */
  .joystick-zone { position: absolute; left: 30px; bottom: 30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.15); pointer-events: auto; display: none; }
  .joystick-knob { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.3); top: 40px; left: 40px; pointer-events: none; }

  /* Main Menu Overlay */
  .modal {
    position: absolute; inset: 0; background: rgba(8, 6, 14, 0.95); backdrop-filter: blur(20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 24px; text-align: center; transition: opacity 0.3s;
  }
  .modal.hidden { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 900; margin: 0 0 10px 0; color: #fff; text-shadow: 0 4px 20px var(--accent-glow); }
  .title span { color: var(--accent); }
  .desc { max-width: 42ch; color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 28px; }
  
  .btn {
    background: var(--accent); border: none; color: #fff; padding: 16px 40px;
    border-radius: 999px; font-weight: 900; font-size: 1.2rem; cursor: pointer;
    box-shadow: 0 8px 25px var(--accent-glow); transition: transform 0.1s, background 0.2s;
  }
  .btn:hover { background: #ff4d4d; }
  .btn:active { transform: scale(0.95); }

  @media (pointer: coarse) { .joystick-zone { display: block; } }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud" id="hud" style="display: none;">
  <div class="hud-top">
    <div class="panel stats-grid">
      <div class="stat-item"><span>HEALTH</span><b id="hp-val" style="color: #2ed573;">100</b></div>
      <div class="stat-item"><span>AMMO</span><b id="ammo-val">30 / 30</b></div>
      <div class="stat-item"><span>SCORE</span><b id="score-val">0</b></div>
    </div>
    <div class="panel">
      <span style="color: var(--text-muted); font-size: 0.75rem; display: block;">WAVE</span>
      <b id="wave-val" style="font-size: 1.3rem; color: var(--accent);">1</b>
    </div>
  </div>
</div>

<div class="joystick-zone" id="joy-zone"><div class="joystick-knob" id="joy-knob"></div></div>

<div class="modal" id="menu">
  <h1 class="title">ZOMBIE <span>OUTBREAK</span></h1>
  <p class="desc">Survive endless hordes of the undead. Collect ammo drops, manage your reloads, and see what wave you and your friends can reach!</p>
  <button class="btn" id="start-btn">SURVIVE NOW</button>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Audio Context for Sound Effects
  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.linearRampToValueAtTime(30, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.start(t); osc.stop(t + 0.16);
      }
    } catch(e) {}
  }

  // Game State
  let gameRunning = false;
  let score = 0, wave = 1;
  let player = {
    x: canvas.width / 2, y: canvas.height / 2,
    radius: 18, speed: 4.5, hp: 100, maxHp: 100,
    ammo: 30, maxAmmo: 30, reloading: false
  };

  let zombies = [];
  let bullets = [];
  let particles = [];
  let drops = [];

  const keys = {};
  window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') reloadGun(); });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

  function reloadGun() {
    if (player.reloading || player.ammo === player.maxAmmo) return;
    player.reloading = true;
    setTimeout(() => {
      player.ammo = player.maxAmmo;
      player.reloading = false;
      updateHUD();
    }, 1200);
  }

  function spawnWave() {
    const count = 4 + wave * 3;
    for (let i = 0; i < count; i++) {
      // Spawn along outer edges
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -50 : canvas.width + 50;
        y = Math.random() * canvas.height;
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -50 : canvas.height + 50;
      }
      zombies.push({
        x, y, radius: 16,
        speed: 1.8 + Math.random() * 0.8 + (wave * 0.1),
        hp: 30 + (wave * 10)
      });
    }
  }

  function updateHUD() {
    document.getElementById('hp-val').textContent = Math.max(0, player.hp);
    document.getElementById('ammo-val').textContent = player.reloading ? 'RELOADING...' : `${player.ammo} / ${player.maxAmmo}`;
    document.getElementById('score-val').textContent = score;
    document.getElementById('wave-val').textContent = wave;
  }

  // Shooting mechanics
  let lastShoot = 0;
  function shootBullet() {
    if (player.reloading) return;
    if (player.ammo <= 0) { reloadGun(); return; }

    const now = performance.now();
    if (now - lastShoot < 150) return; // Fire rate limit
    lastShoot = now;

    player.ammo--;
    playSound('shoot');

    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * 12,
      vy: Math.sin(angle) * 12,
      damage: 25
    });
    updateHUD();
  }

  // Mobile joystick variables
  let joyActive = false, joyVector = { x: 0, y: 0 };
  const joyZone = document.getElementById('joy-zone');
  const joyKnob = document.getElementById('joy-knob');
  let joyTouchId = null, joyOrigin = { x: 0, y: 0 };

  joyZone.addEventListener('touchstart', e => {
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    const rect = joyZone.getBoundingClientRect();
    joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    joyActive = true;
  });

  joyZone.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyTouchId) {
        const dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
        const dist = Math.hypot(dx, dy), maxDist = 45, angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);
        joyKnob.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
        joyVector.x = Math.cos(angle) * (clampedDist / maxDist);
        joyVector.y = Math.sin(angle) * (clampedDist / maxDist);
      }
    }
  });

  function endTouch(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyTouchId = null; joyActive = false;
        joyKnob.style.transform = `translate(0px, 0px)`;
        joyVector.x = 0; joyVector.y = 0;
      }
    }
  }
  joyZone.addEventListener('touchend', endTouch);
  joyZone.addEventListener('touchcancel', endTouch);

  // Game Loop
  function update() {
    if (!gameRunning) return;

    // Player Movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    
    if (joyActive) {
      player.x += joyVector.x * player.speed;
      player.y += joyVector.y * player.speed;
    } else {
      player.x += dx * player.speed;
      player.y += dy * player.speed;
    }

    // Screen bounds
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (mouse.down) shootBullet();

    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx; b.y += b.vy;

      // Out of bounds check
      if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
        bullets.splice(i, 1);
        continue;
      }

      // Zombie collision
      for (let j = zombies.length - 1; j >= 0; j--) {
        let z = zombies[j];
        if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
          z.hp -= b.damage;
          bullets.splice(i, 1);
          
          // Hit spark particles
          for(let p=0; p<4; p++) {
            particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 15, color: '#ff3838' });
          }

          if (z.hp <= 0) {
            score += 100;
            // Drop ammo or health occasionally
            if (Math.random() < 0.25) {
              drops.push({ x: z.x, y: z.y, type: Math.random() < 0.5 ? 'ammo' : 'hp' });
            }
            zombies.splice(j, 1);
            if (zombies.length === 0) {
              wave++;
              spawnWave();
            }
          }
          break;
        }
      }
    }

    // Update Zombies
    for (let z of zombies) {
      const angle = Math.atan2(player.y - z.y, player.x - z.x);
      z.x += Math.cos(angle) * z.speed;
      z.y += Math.sin(angle) * z.speed;

      // Damage Player
      if (Math.hypot(player.x - z.x, player.y - z.y) < player.radius + z.radius) {
        player.hp -= 0.8;
        playSound('hit');
        updateHUD();
        if (player.hp <= 0) {
          gameRunning = false;
          document.getElementById('menu').classList.remove('hidden');
          document.getElementById('hud').style.display = 'none';
        }
      }
    }

    // Update Item Pickups
    for (let i = drops.length - 1; i >= 0; i--) {
      let d = drops[i];
      if (Math.hypot(player.x - d.x, player.y - d.y) < player.radius + 15) {
        if (d.type === 'ammo') { player.ammo = player.maxAmmo; }
        if (d.type === 'hp') { player.hp = Math.min(player.maxHp, player.hp + 30); }
        drops.splice(i, 1);
        updateHUD();
      }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = '#0b0914';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid floor pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    for (let x = 0; x < canvas.width; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Draw Drops
    for (let d of drops) {
      ctx.fillStyle = d.type === 'ammo' ? '#ffb703' : '#2ed573';
      ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.type === 'ammo' ? 'AMMO' + '' : 'HEAL', d.x, d.y + 4);
    }

    // Draw Bullets
    ctx.fillStyle = '#ffe600';
    for (let b of bullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    }

    // Draw Zombies
    for (let z of zombies) {
      ctx.fillStyle = '#228b22';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0f380f'; ctx.lineWidth = 3; ctx.stroke();
    }

    // Draw Player
    ctx.save();
    ctx.translate(player.x, player.y);
    const pAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    ctx.rotate(pAngle);

    ctx.fillStyle = '#58cc02';
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#327301'; ctx.lineWidth = 3; ctx.stroke();

    // Gun barrel
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -4, 20, 8);
    ctx.restore();

    // Draw Particles
    for (let p of particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.getElementById('start-btn').addEventListener('click', () => {
    player.hp = 100; player.ammo = 30; score = 0; wave = 1;
    zombies = []; bullets = []; drops = [];
    spawnWave();
    gameRunning = true;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    updateHUD();
  });

})();
</script>
</body>
</html>
