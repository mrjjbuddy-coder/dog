<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catch the Dog - Get My Phone Back!</title>
    <style>
        body { text-align: center; background: #111; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { color: #4caf50; margin-bottom: 5px; }
        canvas { background: #388e3c; border: 4px solid #fff; display: block; margin: 15px auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .info { font-size: 18px; margin: 5px; }
    </style>
</head>
<body>

    <h1>Catch the Dog & Get Your Phone Back!</h1>
    <p class="info">Use <b>Arrow Keys</b> or <b>W/A/S/D</b> to chase the dog!</p>
    <div class="info">
        <span id="scoreDisplay">Phones Recovered: 0</span> | 
        <span id="timerDisplay">Time Left: 30s</span>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game state variables
        let score = 0;
        let timeLeft = 30;
        let gameOver = false;
        let gameStarted = true;

        // Player (You)
        let player = { x: 100, y: 250, size: 28, speed: 4.5, color: "#2196f3" };
        
        // Dog (The thief)
        let dog = { x: 600, y: 250, size: 25, speed: 3.2, color: "#8d6e63" };
        
        // Energy Drink (Boosts speed temporarily)
        let energyDrink = { x: Math.random() * 700 + 50, y: Math.random() * 400 + 50, size: 15, active: true };

        let keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // Countdown Timer
        let timerInterval = setInterval(() => {
            if (gameStarted && !gameOver) {
                timeLeft--;
                document.getElementById("timerDisplay").innerText = "Time Left: " + timeLeft + "s";
                if (timeLeft <= 0) {
                    gameOver = true;
                    clearInterval(timerInterval);
                }
            }
        }, 1000);

        function update() {
            if (gameOver) return;

            // Player movement with boundaries
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y < canvas.height - player.size) player.y += player.speed;
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.size) player.x += player.speed;

            // Smarter Dog AI: Wanders and tries to run away when you get close
            let dx = player.x - dog.x;
            let dy = player.y - dog.y;
            let distToPlayer = Math.sqrt(dx * dx + dy * dy);

            if (distToPlayer < 200) {
                // Run away from player
                dog.x -= (dx / distToPlayer) * dog.speed;
                dog.y -= (dy / distToPlayer) * dog.speed;
            } else {
                // Random casual wandering if far away
                if (Math.random() < 0.05) {
                    dog.vx = (Math.random() - 0.5) * 4;
                    dog.vy = (Math.random() - 0.5) * 4;
                }
                if (dog.vx) dog.x += dog.vx;
                if (dog.vy) dog.y += dog.vy;
            }

            // Keep dog inside canvas bounds
            dog.x = Math.max(0, Math.min(canvas.width - dog.size, dog.x));
            dog.y = Math.max(0, Math.min(canvas.height - dog.size, dog.y));

            // Check if player catches the dog (got the phone back!)
            if (distToPlayer < 30) {
                score++;
                document.getElementById("scoreDisplay").innerText = "Phones Recovered: " + score;
                // Teleport dog to a new random spot
                dog.x = Math.random() * 700;
                dog.y = Math.random() * 400;
                // Increase dog speed slightly for challenge
                dog.speed += 0.2;
            }

            // Check if player collects energy drink
            if (energyDrink.active) {
                let pdx = player.x - energyDrink.x;
                let pdy = player.y - energyDrink.y;
                if (Math.sqrt(pdx * pdx + pdy * pdy) < 25) {
                    player.speed = 7; // Super speed boost
                    energyDrink.active = false;
                    setTimeout(() => { player.speed = 4.5; }, 4000); // Reset after 4 seconds
                }
            }
        }

        function draw() {
            // Background grass pattern effect
            ctx.fillStyle = "#43a047";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Energy Drink item if active
            if (energyDrink.active) {
                ctx.fillStyle = "#ffeb3b";
                ctx.fillRect(energyDrink.x, energyDrink.y, energyDrink.size, energyDrink.size);
            }

            // Draw Phone symbol on the dog (the thief!)
            ctx.fillStyle = "#00bcd4";
            ctx.fillRect(dog.x - 5, dog.y - 12, 10, 15); // Phone in mouth

            // Draw Dog
            ctx.fillStyle = dog.color;
            ctx.fillRect(dog.x, dog.y, dog.size, dog.size);

            // Draw Player (You)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Game Over Screen Overlay
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "35px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Time's Up! You got your phone back " + score + " times!", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = "18px sans-serif";
                ctx.fillStyle = "#4caf50";
                ctx.fillText("Refresh the page to play again!", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
