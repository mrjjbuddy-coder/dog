<!doctype html>
<html>
<head>
<meta charset="utf8">
<title>Pawsession - Complete Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #241f3a; font-family: sans-serif; color: #fff3dc; user-select: none; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 12px; left: 16px; padding: 10px 14px; border-radius: 10px; background: rgba(30, 26, 50, 0.85); border: 1px solid rgba(255,243,220,0.3); pointer-events: none; z-index: 10; }
  #joyZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 60%; touch-action: none; z-index: 10; }
  .toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); padding: 8px 16px; background: rgba(30,26,50,0.9); border-radius: 8px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  #startScreen { position: absolute; inset: 0; background: rgba(36,31,58,0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
  .go { margin-top: 20px; padding: 16px 36px; border: 0; border-radius: 999px; background: #ffd35e; color: #2a2208; font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 211, 94, 0.3); }
</style>
</head>
<body>

<!-- Background Music Player (Plays right on the website when started) -->
<audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<div id="startScreen">
  <h1>Pawsession</h1>
  <p>Biscuit took your phone! Match the shapes and chase him through the house.<br>Click start to play with background music.</p>
  <button class="go" id="startBtn">Start the Chase</button>
</div>

<div id="stage">
  <canvas id="gl"></canvas>
  <div class="hud">
    <b>Objective:</b> Match the shapes and catch Biscuit!<br>
    <span style="font-size: 12px; color: #bdb4d8;">Drag on the left side of the screen to move.</span>
  </div>
  <div class="toast" id="toast"></div>
  <div id="joyZone"></div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage'), canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.shadowMap.enabled = true;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x241f3a);

  var camera = new THREE.PerspectiveCamera(50, stage.clientWidth / stage.clientHeight, 0.5, 140);
  camera.position.set(0, 15, 25);
  camera.lookAt(0, 0, 5);

  scene.add(new THREE.HemisphereLight(0xfff3e0, 0x6b5b8a, 0.9));
  var sun = new THREE.DirectionalLight(0xffe7c2, 0.8);
  sun.position.set(10, 20, 10);
  sun.castShadow = true;
  scene.add(sun);

  function box(w, h, d, c, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
    scene.add(m); return m;
  }

  // Full House Layout & Rooms
  box(12, 0.1, 12, 0x5b3f73, 0, 0, 12); // Living room
  box(12, 0.1, 12, 0x7fc4b8, 0, 0, 0);  // Kitchen
  box(12, 0.1, 12, 0x5b3f73, 0, 0, -12); // Study room
  box(16, 0.1, 15, 0x5f9f4e, 0, 0, -26); // Backyard

  // Shape Texture Generator for Blocks
  function createShapeTexture(type, colorHex) {
    var canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    var ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#fff3dc';
    ctx.fillRect(0, 0, 128, 128);
    ctx.strokeStyle = '#241f3a';
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, 120, 120);

    ctx.fillStyle = colorHex;
    if (type === 'circle') {
      ctx.beginPath(); ctx.arc(64, 64, 30, 0, Math.PI * 2); ctx.fill();
    } else if (type === 'triangle') {
      ctx.beginPath(); ctx.moveTo(64, 25); ctx.lineTo(105, 95); ctx.lineTo(23, 95); ctx.closePath(); ctx.fill();
    } else if (type === 'square') {
      ctx.fillRect(34, 34, 60, 60);
    }
    return new THREE.CanvasTexture(canvas);
  }

  // Puzzle Blocks with visible shapes
  var b1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 1.5), [
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({ map: createShapeTexture('circle', '#e5484d') }),
    new THREE.MeshLambertMaterial({color: 0xcccccc})
  ]);
  b1.position.set(-3, 0.9, 2); scene.add(b1);

  var b2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 1.5), [
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({ map: createShapeTexture('triangle', '#3e8ef7') }),
    new THREE.MeshLambertMaterial({color: 0xcccccc})
  ]);
  b2.position.set(0, 0.9, 2); scene.add(b2);

  var b3 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 1.5), [
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({color: 0xcccccc}), new THREE.MeshLambertMaterial({color: 0xcccccc}),
    new THREE.MeshLambertMaterial({ map: createShapeTexture('square', '#3fbf6d') }),
    new THREE.MeshLambertMaterial({color: 0xcccccc})
  ]);
  b3.position.set(3, 0.9, 2); scene.add(b3);

  // Player Ball Character
  var playerMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshLambertMaterial({ color: 0xffd35e })
  );
  playerMesh.position.set(0, 0.5, 14);
  scene.add(playerMesh);

  var P = { x: 0, z: 14 };
  var input = { x: 0, z: 0 };
  var running = false;

  function toast(msg) {
    var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Start Button Event Listener (Triggers Game & Music)
  document.getElementById('startBtn').addEventListener('click', function() {
    var music = document.getElementById('bgMusic');
    if (music) {
      music.volume = 0.5;
      music.play().catch(function(error) { console.log("Audio play blocked"); });
    }
    document.getElementById('startScreen').style.display = 'none';
    running = true;
    toast('Match the shapes and chase Biscuit!');
  });

  var joyZone = document.getElementById('joyZone');
  joyZone.addEventListener('pointermove', function(e) {
    var r = stage.getBoundingClientRect();
    var dx = (e.clientX - r.left) - r.width/4, dy = (e.clientY - r.top) - r.height/2;
    var m = Math.hypot(dx, dy);
    input.x = m < 5 ? 0 : dx / 50; 
    input.z = m < 5 ? 0 : dy / 50;
  });
  joyZone.addEventListener('pointerup', function() { input.x = 0; input.z = 0; });

  function update(dt) {
    if (!running) return;
    P.x += input.x * 6 * dt; 
    P.z += input.z * 6 * dt;
    playerMesh.position.set(P.x, 0.5, P.z);

    camera.position.x += (P.x - camera.position.x) * 0.05;
    camera.position.z += ((P.z + 12) - camera.position.z) * 0.05;
    camera.lookAt(P.x, 0, P.z - 2);
  }

  var last = 0;
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    update(dt); 
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
